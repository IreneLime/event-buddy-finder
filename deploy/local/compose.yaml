services:
  database:
    image: postgres:15-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: event_buddy_finder
      POSTGRES_USER: event_buddy
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U event_buddy -d event_buddy_finder"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: postgres:15-alpine
    mem_limit: 512m
    working_dir: /workspace
    command: ["sh", "deploy/local/migrate.sh", "--seed"]
    environment:
      DATABASE_URL: postgresql://event_buddy:local-demo-only@database:5432/event_buddy_finder
    volumes:
      - ../../database:/workspace/database:ro
      - .:/workspace/deploy/local:ro
    depends_on:
      database:
        condition: service_healthy

  app:
    mem_limit: 2g
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    ports:
      - "127.0.0.1:5180:5173"
      - "127.0.0.1:14001:4001"
      - "127.0.0.1:14002:4002"
      - "127.0.0.1:14003:4003"
      - "127.0.0.1:14004:4004"
      - "127.0.0.1:14005:4005"
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/firebase-admin.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://event_buddy:local-demo-only@database:5432/event_buddy_finder
      HOST: 0.0.0.0
      EVENT_BUDDY_VITE_HOST: 0.0.0.0
      WEB_ORIGIN: http://127.0.0.1:5180
      AUTH_API_URL: http://127.0.0.1:4003
      ALLOW_DEV_AUTH: "false"
      CHAT_DEV_MODE: "false"
      CHAT_LOAD_DEMO_HISTORY: "true"
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      LIVE_FIREBASE_API_KEY: ${LIVE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_EVENTS_API_URL: http://127.0.0.1:14001
      VITE_CHAT_API_URL: http://127.0.0.1:14002
      VITE_USERS_API_URL: http://127.0.0.1:14004
      VITE_IMAGE_API_URL: http://127.0.0.1:14005
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_REGION: ${SPACES_REGION:-us-east-1}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:-}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:-}
      SPACES_DOWNLOAD_URL_EXPIRES_IN_SECONDS: ${SPACES_DOWNLOAD_URL_EXPIRES_IN_SECONDS:-900}
    healthcheck:
      test: ["CMD", "node", "deploy/local/health.mjs"]
      interval: 3s
      timeout: 3s
      retries: 50

volumes:
  database:
